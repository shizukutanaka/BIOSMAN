<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>BIOSMAN — Motherboard BIOS Manager</title>
<style>
:root{
  --bg:#0d1117; --bg2:#111826; --card:#161e2c; --card2:#1b2637;
  --line:#2a3648; --text:#e6edf3; --sub:#93a4bb; --faint:#6b7c93;
  --accent:#4da3ff; --accent2:#2f7fe0;
  --ok:#3fb96f; --warn:#e8a33d; --bad:#e5534b; --gray:#8b98a9;
  --chip:#22314a;
}
*{box-sizing:border-box}
html,body{margin:0;padding:0}
body{
  background:var(--bg); color:var(--text);
  font-family:"Segoe UI","Hiragino Kaku Gothic ProN","Hiragino Sans","Noto Sans JP",Meiryo,system-ui,-apple-system,sans-serif;
  font-size:15px; line-height:1.55;
}
a{color:var(--accent)}
button{font-family:inherit; cursor:pointer}
input,select,textarea{font-family:inherit; font-size:14px}
header.top{
  position:sticky; top:0; z-index:40;
  background:rgba(13,17,23,.94); backdrop-filter:blur(6px);
  border-bottom:1px solid var(--line);
}
.top-in{max-width:1080px; margin:0 auto; padding:12px 16px; display:flex; align-items:center; gap:12px; flex-wrap:wrap}
.logo{display:flex; align-items:baseline; gap:10px; margin-right:auto}
.logo .name{font-size:24px; font-weight:800; letter-spacing:2px}
.logo .name span{color:var(--accent)}
.logo .tag{color:var(--sub); font-size:12px}
.top-actions{display:flex; gap:8px; flex-wrap:wrap; align-items:center}
.btn{
  background:var(--card2); color:var(--text); border:1px solid var(--line);
  border-radius:8px; padding:8px 14px; font-size:13.5px; font-weight:600;
}
.btn:hover{border-color:var(--accent)}
.btn.primary{background:var(--accent2); border-color:var(--accent2); color:#fff}
.btn.primary:hover{background:var(--accent)}
.btn.danger{color:#ff9d97}
.btn:disabled{opacity:.45; cursor:not-allowed}
.btn.small{padding:5px 10px; font-size:12.5px; border-radius:7px}
select.langsel{
  background:var(--card2); color:var(--text); border:1px solid var(--line);
  border-radius:8px; padding:8px 10px; font-size:13.5px; font-weight:600;
}
main{max-width:1080px; margin:0 auto; padding:18px 16px 60px}
.notice{
  background:#221a10; border:1px solid #6b4d1f; color:#f0cf9a;
  border-radius:10px; padding:10px 14px; font-size:13.5px; margin-bottom:16px;
}
.stats{display:grid; grid-template-columns:repeat(5,1fr); gap:10px; margin-bottom:16px}
.stat{background:var(--card); border:1px solid var(--line); border-radius:12px; padding:14px 16px}
.stat .num{font-size:30px; font-weight:800; line-height:1.1}
.stat .lbl{color:var(--sub); font-size:12.5px; margin-top:2px}
.stat.s-update .num{color:var(--warn)}
.stat.s-latest .num{color:var(--ok)}
.stat.s-unknown .num{color:var(--gray)}
.stat.s-usbpend .num{color:var(--bad)}
.chip{display:inline-block; background:var(--chip); color:#bcd6ff; border-radius:12px; padding:1px 9px; font-size:11.5px; font-weight:700}
.chip.warnchip{background:#2c2110; color:var(--warn)}
.usb-line{margin-top:10px; font-size:12.5px; font-weight:800}
.usb-line.ok{color:var(--ok)}
.usb-line.bad{color:var(--bad)}
.badge.ready{background:#0f2a1a; color:var(--ok); border-color:#1f5136}
.badge.stale{background:#2c2110; color:var(--warn); border-color:#6b4d1f}
.badge.empty,.badge.none,.badge.orphan{background:#232a35; color:var(--gray); border-color:#39424f}
section.usbsec{margin-top:28px}
.sec-head{display:flex; align-items:center; gap:10px; flex-wrap:wrap; margin-bottom:12px}
.sec-head h2{font-size:19px; margin:0; margin-right:auto}
.guide-rule{background:var(--bg2); border:1px solid var(--line); border-radius:10px; padding:12px 14px; margin-bottom:12px; font-size:13.5px}
.guide-rule .fname{font-size:21px; font-weight:800; color:var(--accent); word-break:break-all; margin:4px 0}
.guide-steps{margin:6px 0 4px; padding-left:22px}
.guide-steps li{margin-bottom:5px; font-size:13.5px}
.guide-note{color:var(--warn); font-size:13px; font-weight:700; margin-top:10px}
.toolbar{display:flex; gap:10px; align-items:center; flex-wrap:wrap; margin-bottom:14px}
.toolbar .spacer{flex:1}
.toolbar label{color:var(--sub); font-size:13px}
.toolbar select{
  background:var(--card2); color:var(--text); border:1px solid var(--line);
  border-radius:8px; padding:7px 10px;
}
.empty{
  background:var(--card); border:1px dashed var(--line); border-radius:14px;
  padding:38px 24px; text-align:center; color:var(--sub);
}
.empty h2{color:var(--text); margin:0 0 8px; font-size:20px}
.empty .row{display:flex; gap:10px; justify-content:center; flex-wrap:wrap; margin-top:18px}
.card{
  background:var(--card); border:1px solid var(--line); border-radius:14px;
  padding:16px 18px; margin-bottom:12px;
}
.card-head{display:flex; align-items:flex-start; gap:10px; flex-wrap:wrap}
.machine{font-size:18px; font-weight:700}
.vendor-chip{
  background:var(--chip); color:#bcd6ff; border-radius:20px; padding:2px 10px;
  font-size:12px; font-weight:700; letter-spacing:.4px;
}
.model{color:var(--sub); font-size:13.5px; margin-top:1px}
.badge{
  margin-left:auto; border-radius:20px; padding:3px 12px; font-size:12.5px; font-weight:800;
  border:1px solid transparent; white-space:nowrap;
}
.badge.update{background:#2c2110; color:var(--warn); border-color:#6b4d1f}
.badge.latest{background:#0f2a1a; color:var(--ok); border-color:#1f5136}
.badge.unknown{background:#232a35; color:var(--gray); border-color:#39424f}
.ver-grid{display:grid; grid-template-columns:1fr 1fr; gap:10px; margin-top:12px}
.ver-box{background:var(--bg2); border:1px solid var(--line); border-radius:10px; padding:10px 12px}
.ver-box .k{color:var(--faint); font-size:11.5px; font-weight:700; letter-spacing:.6px}
.ver-box .v{font-size:17px; font-weight:700; margin-top:2px; word-break:break-all}
.ver-box .d{color:var(--sub); font-size:12px}
.basis{color:var(--faint); font-size:12px; margin-top:8px}
.memo{color:var(--sub); font-size:13px; margin-top:8px; white-space:pre-wrap; word-break:break-word}
.card-actions{display:flex; gap:8px; flex-wrap:wrap; margin-top:14px}
.history{display:none; margin-top:12px; border-top:1px solid var(--line); padding-top:10px}
.history.open{display:block}
.history h4{margin:0 0 8px; font-size:13px; color:var(--sub)}
.history-item{
  background:var(--bg2); border:1px solid var(--line); border-radius:9px;
  padding:8px 12px; margin-bottom:7px; font-size:13px;
}
.history-item .h-top{display:flex; gap:10px; flex-wrap:wrap; align-items:baseline}
.history-item .h-date{color:var(--faint); font-size:12px}
.history-item .h-flow{font-weight:700}
.history-item .h-method{background:var(--chip); border-radius:12px; padding:1px 9px; font-size:11.5px; color:#bcd6ff}
.history-item .h-note{color:var(--sub); margin-top:3px; white-space:pre-wrap}
.history-none{color:var(--faint); font-size:13px}
section.help{
  background:var(--card); border:1px solid var(--line); border-radius:14px;
  padding:18px 20px; margin-top:26px; color:var(--sub); font-size:13.5px;
}
section.help h2{color:var(--text); font-size:17px; margin:0 0 10px}
section.help h3{color:var(--text); font-size:14.5px; margin:16px 0 6px}
section.help ul{margin:6px 0; padding-left:20px}
section.help .vendor-links{display:flex; gap:8px; flex-wrap:wrap; margin-top:6px}
section.help .vendor-links a{
  background:var(--card2); border:1px solid var(--line); border-radius:8px;
  padding:6px 12px; text-decoration:none; font-weight:600; font-size:13px;
}
section.help .vendor-links a:hover{border-color:var(--accent)}
footer{color:var(--faint); font-size:12px; text-align:center; padding:0 16px 34px}
/* modal */
.overlay{
  position:fixed; inset:0; background:rgba(4,7,11,.72); z-index:60;
  display:none; align-items:flex-start; justify-content:center; overflow-y:auto; padding:26px 12px;
}
.overlay.open{display:flex}
.modal{
  background:var(--card); border:1px solid var(--line); border-radius:14px;
  width:100%; max-width:560px; padding:20px 22px; margin:auto 0;
}
.modal h2{margin:0 0 4px; font-size:19px}
.modal .sub{color:var(--sub); font-size:13px; margin-bottom:14px}
.field{margin-bottom:12px}
.field label{display:block; font-size:12.5px; font-weight:700; color:var(--sub); margin-bottom:4px}
.field input,.field select,.field textarea{
  width:100%; background:var(--bg2); color:var(--text); border:1px solid var(--line);
  border-radius:8px; padding:9px 11px;
}
.field textarea{resize:vertical; min-height:58px}
.field .hint{color:var(--faint); font-size:11.5px; margin-top:3px}
.frow{display:grid; grid-template-columns:1fr 1fr; gap:10px}
.modal-actions{display:flex; gap:8px; justify-content:flex-end; margin-top:16px; flex-wrap:wrap}
.flow{
  display:flex; align-items:center; gap:10px; background:var(--bg2);
  border:1px solid var(--line); border-radius:10px; padding:10px 14px; margin-bottom:14px;
  font-weight:700; flex-wrap:wrap;
}
.flow .arr{color:var(--accent)}
.checklist{display:flex; flex-direction:column; gap:8px; margin:6px 0 4px}
.check-item{
  display:flex; gap:10px; align-items:flex-start; background:var(--bg2);
  border:1px solid var(--line); border-radius:10px; padding:10px 12px; cursor:pointer;
}
.check-item input{margin-top:3px; width:17px; height:17px; flex:none; accent-color:var(--accent2)}
.check-item .ct{font-size:13.5px}
.check-item.checked{border-color:var(--ok)}
.warn-text{color:var(--warn); font-size:13px; font-weight:700}
.pcpanel{background:var(--card); border:1px solid var(--line); border-radius:14px; padding:16px 18px; margin-bottom:14px}
.pc-head{display:flex; align-items:center; gap:10px; flex-wrap:wrap}
.pc-head h3{margin:0; font-size:16px; margin-right:auto}
.pc-note{color:var(--warn); font-size:13px; margin-top:8px}
.pc-actions{display:flex; gap:8px; flex-wrap:wrap; margin-top:12px}
.newver-banner{background:#2c2110; border:1px solid #6b4d1f; color:#ffd9a0; border-radius:10px; padding:10px 14px; margin-top:12px; font-size:13.5px}
.newver-banner .nvb-title{font-weight:800; margin-bottom:4px}
.scan-scroll{overflow-x:auto; margin-top:8px}
table.scan{width:100%; border-collapse:collapse; font-size:13px; min-width:780px}
table.scan th,table.scan td{border-bottom:1px solid var(--line); padding:8px; vertical-align:top; text-align:left}
table.scan th{color:var(--sub); font-size:12px}
.scan-name{font-weight:700; word-break:break-all}
.scan-path{color:var(--faint); font-size:11.5px; word-break:break-all}
.scan-sub{color:var(--sub); font-size:12px; margin-top:3px}
.scan-est{color:var(--faint); font-size:11.5px; margin-top:3px}
.scan-badge{margin-left:0; margin-top:5px; display:inline-block}
.ver-input{width:120px; background:var(--bg2); color:var(--text); border:1px solid var(--line); border-radius:7px; padding:6px 8px; font-size:13px}
.chip.graychip{background:#232a35; color:var(--gray)}
.cand-head{font-weight:800; font-size:15px; margin:14px 0 6px}
.cand-row{display:flex; gap:10px; align-items:center; flex-wrap:wrap; background:var(--bg2); border:1px solid var(--line); border-radius:10px; padding:9px 12px; margin-bottom:8px; font-size:13.5px}
.cand-row .cand-ver{font-size:16px; font-weight:800; color:var(--accent)}
@media (max-width:640px){
  .stats{grid-template-columns:repeat(2,1fr)}
  .ver-grid{grid-template-columns:1fr}
  .frow{grid-template-columns:1fr}
  .badge{margin-left:0}
  .logo .tag{display:none}
}
</style>
</head>
<body>
<header class="top">
  <div class="top-in">
    <div class="logo">
      <div class="name">BIOS<span>MAN</span></div>
      <div class="tag" data-i18n="tagline"></div>
    </div>
    <div class="top-actions">
      <button class="btn" id="btnCollector" data-i18n="btnCollector"></button>
      <button class="btn" id="btnExport" data-i18n="btnExport"></button>
      <button class="btn" id="btnImportFileBtn" data-i18n="btnImport"></button>
      <input type="file" id="fileImport" accept="application/json,.json" style="display:none">
      <select class="langsel" id="langSel" aria-label="Language">
        <option value="ja">日本語</option>
        <option value="en">English</option>
      </select>
      <button class="btn primary" id="btnAdd" data-i18n="btnAdd"></button>
    </div>
  </div>
</header>

<main>
  <div class="notice" data-i18n="honestNotice"></div>

  <div class="stats">
    <div class="stat s-total"><div class="num" id="statTotal">0</div><div class="lbl" data-i18n="statTotal"></div></div>
    <div class="stat s-update"><div class="num" id="statUpdate">0</div><div class="lbl" data-i18n="statUpdate"></div></div>
    <div class="stat s-latest"><div class="num" id="statLatest">0</div><div class="lbl" data-i18n="statLatest"></div></div>
    <div class="stat s-unknown"><div class="num" id="statUnknown">0</div><div class="lbl" data-i18n="statUnknown"></div></div>
    <div class="stat s-usbpend"><div class="num" id="statUsbPend">0</div><div class="lbl" data-i18n="statUsbPend"></div></div>
  </div>

  <div class="toolbar">
    <label for="sortSel" data-i18n="sortLabel"></label>
    <select id="sortSel">
      <option value="update" data-i18n="sortUpdate"></option>
      <option value="created" data-i18n="sortCreated"></option>
      <option value="machine" data-i18n="sortMachine"></option>
    </select>
    <div class="spacer"></div>
    <button class="btn" id="btnImportOpen" data-i18n="btnPasteImport"></button>
  </div>

  <div id="emptyState" class="empty" style="display:none">
    <h2 data-i18n="emptyTitle"></h2>
    <div data-i18n="emptyBody"></div>
    <div class="row">
      <button class="btn primary" id="btnAddFirst" data-i18n="btnAddFirst"></button>
      <button class="btn" id="btnImportFirst" data-i18n="btnPasteImport"></button>
    </div>
  </div>

  <div id="boardList"></div>

  <section class="usbsec">
    <div class="sec-head">
      <h2 data-i18n="usbSectionTitle"></h2>
      <button class="btn" id="btnGuideOpen" data-i18n="btnGuide"></button>
      <button class="btn primary" id="btnAddUsb" data-i18n="btnAddUsb"></button>
    </div>
    <div class="pcpanel" id="pcPanel">
      <div class="pc-head">
        <h3 data-i18n="pcTitle"></h3>
        <span class="chip" id="pcState"></span>
      </div>
      <div class="pc-note" id="pcUnavailable" data-i18n="pcUnavailable" style="display:none"></div>
      <div class="newver-banner" id="newVerBanner" style="display:none"></div>
      <div class="pc-actions" id="pcActions">
        <button class="btn primary" id="btnScanUsb" data-i18n="btnScanUsb"></button>
        <button class="btn" id="btnCheckVer" data-i18n="btnCheckVer"></button>
      </div>
      <div class="basis" id="scanMeta"></div>
      <div id="scanList"></div>
      <div id="checkMeta" style="margin-top:8px"></div>
      <div id="candidateList"></div>
    </div>
    <div id="usbEmpty" class="empty" style="display:none">
      <div data-i18n="usbEmptyBody"></div>
      <div class="row">
        <button class="btn primary" id="btnAddUsbFirst" data-i18n="btnAddUsb"></button>
      </div>
    </div>
    <div id="usbList"></div>
  </section>

  <section class="help">
    <h2 data-i18n="helpTitle"></h2>
    <div data-i18n="helpAbout"></div>
    <h3 data-i18n="helpVendorsTitle"></h3>
    <div class="vendor-links" id="vendorLinks"></div>
    <h3 data-i18n="helpCollectTitle"></h3>
    <div data-i18n="helpCollectBody"></div>
    <h3 data-i18n="helpUsbTitle"></h3>
    <div data-i18n="helpUsbBody"></div>
    <h3 data-i18n="helpPcTitle"></h3>
    <div data-i18n="helpPcBody"></div>
    <h3 data-i18n="helpDataTitle"></h3>
    <div data-i18n="helpDataBody"></div>
  </section>
</main>
<footer>BIOSMAN — <span data-i18n="footerNote"></span></footer>

<!-- Board add/edit modal -->
<div class="overlay" id="boardModal">
  <div class="modal">
    <h2 id="boardModalTitle"></h2>
    <div class="sub" data-i18n="formSub"></div>
    <form id="boardForm">
      <input type="hidden" id="fId">
      <div class="frow">
        <div class="field">
          <label for="fMachine" data-i18n="fMachine"></label>
          <input id="fMachine" required maxlength="80">
        </div>
        <div class="field">
          <label for="fVendor" data-i18n="fVendor"></label>
          <select id="fVendor">
            <option value="ASUS">ASUS</option>
            <option value="MSI">MSI</option>
            <option value="GIGABYTE">GIGABYTE</option>
            <option value="ASRock">ASRock</option>
            <option value="Biostar">Biostar</option>
            <option value="Other" data-i18n="vendorOther"></option>
          </select>
        </div>
      </div>
      <div class="field">
        <label for="fModel" data-i18n="fModel"></label>
        <input id="fModel" required maxlength="120">
        <div class="hint" data-i18n="fModelHint"></div>
      </div>
      <div class="frow">
        <div class="field">
          <label for="fCurVer" data-i18n="fCurVer"></label>
          <input id="fCurVer" maxlength="40" placeholder="2613">
        </div>
        <div class="field">
          <label for="fCurDate" data-i18n="fCurDate"></label>
          <input id="fCurDate" type="date">
        </div>
      </div>
      <div class="frow">
        <div class="field">
          <label for="fLatestVer" data-i18n="fLatestVer"></label>
          <input id="fLatestVer" maxlength="40" placeholder="2904">
        </div>
        <div class="field">
          <label for="fLatestDate" data-i18n="fLatestDate"></label>
          <input id="fLatestDate" type="date">
        </div>
      </div>
      <div class="field">
        <label for="fDlUrl" data-i18n="fDlUrl"></label>
        <input id="fDlUrl" type="url" maxlength="500" placeholder="https://">
        <div class="hint" data-i18n="fDlUrlHint"></div>
      </div>
      <div class="field">
        <label for="fMemo" data-i18n="fMemo"></label>
        <textarea id="fMemo" maxlength="1000"></textarea>
      </div>
      <div class="modal-actions">
        <button type="button" class="btn" id="btnBoardCancel" data-i18n="cancel"></button>
        <button type="submit" class="btn primary" id="btnBoardSave" data-i18n="save"></button>
      </div>
    </form>
  </div>
</div>

<!-- Update record modal -->
<div class="overlay" id="updateModal">
  <div class="modal">
    <h2 data-i18n="uTitle"></h2>
    <div class="sub" id="uBoardName"></div>
    <div class="flow"><span id="uFrom"></span><span class="arr">→</span><span id="uTo"></span></div>
    <div class="field">
      <label data-i18n="uChecklistTitle"></label>
      <div class="checklist" id="uChecklist"></div>
    </div>
    <div class="frow">
      <div class="field">
        <label for="uMethod" data-i18n="uMethod"></label>
        <select id="uMethod">
          <option value="USB BIOS Flashback">USB BIOS Flashback</option>
          <option value="EZ Flash">EZ Flash (ASUS)</option>
          <option value="M-Flash">M-Flash (MSI)</option>
          <option value="Q-Flash">Q-Flash (GIGABYTE)</option>
          <option value="Instant Flash">Instant Flash (ASRock)</option>
          <option value="Other" data-i18n="methodOther"></option>
        </select>
      </div>
      <div class="field">
        <label for="uDate" data-i18n="uDate"></label>
        <input id="uDate" type="date">
      </div>
    </div>
    <div class="field">
      <label for="uNote" data-i18n="uNote"></label>
      <textarea id="uNote" maxlength="500"></textarea>
    </div>
    <div class="warn-text" data-i18n="uWarn"></div>
    <div class="modal-actions">
      <button type="button" class="btn" id="btnUpdateCancel" data-i18n="cancel"></button>
      <button type="button" class="btn primary" id="btnUpdateConfirm" disabled data-i18n="uConfirm"></button>
    </div>
  </div>
</div>

<!-- Paste import modal -->
<div class="overlay" id="importModal">
  <div class="modal">
    <h2 data-i18n="iTitle"></h2>
    <div class="sub" data-i18n="iSub"></div>
    <div class="field">
      <label for="importMachine" data-i18n="fMachine"></label>
      <input id="importMachine" maxlength="80">
    </div>
    <div class="field">
      <label for="importText" data-i18n="iTextLabel"></label>
      <textarea id="importText" rows="8" style="font-family:Consolas,monospace; font-size:12.5px" placeholder="BASEBOARD_MANUFACTURER=ASUSTeK COMPUTER INC.&#10;BASEBOARD_PRODUCT=ROG STRIX B650E-F GAMING WIFI&#10;BIOS_VERSION=2613&#10;BIOS_RELEASEDATE=2024-10-05"></textarea>
    </div>
    <div class="modal-actions">
      <button type="button" class="btn" id="btnImportCancel" data-i18n="cancel"></button>
      <button type="button" class="btn primary" id="btnImportParse" data-i18n="iParse"></button>
    </div>
  </div>
</div>

<!-- USB add/edit modal -->
<div class="overlay" id="usbModal">
  <div class="modal">
    <h2 id="usbModalTitle"></h2>

<script>
"use strict";
/* ---------- state ---------- */
var state = loadState();
var sortMode = "update";
var updateTargetId = null;
var openHistory = {};

function loadState(){
  try{
    var raw = localStorage.getItem(STORAGE_KEY);
    if(raw){
      var parsed = JSON.parse(raw);
      if(parsed && Array.isArray(parsed.boards)){
        return {
          lang: parsed.lang === "en" ? "en" : "ja",
          boards: parsed.boards,
          usbs: Array.isArray(parsed.usbs) ? parsed.usbs : []
        };
      }
    }
  }catch(e){ /* corrupted storage: start clean rather than crash */ }
  return { lang: "ja", boards: [], usbs: [] };
}
function saveState(){
  try{ localStorage.setItem(STORAGE_KEY, JSON.stringify(state)); }catch(e){ /* quota: keep running */ }
}
function t(key){
  var d = I18N[state.lang] || I18N.ja;
  return (key in d) ? d[key] : (I18N.ja[key] || key);
}
function esc(s){
  return String(s == null ? "" : s)
    .replace(/&/g,"&amp;").replace(/</g,"&lt;").replace(/>/g,"&gt;")
    .replace(/"/g,"&quot;").replace(/'/g,"&#39;");
}
function uid(){
  return "b" + Date.now().toString(36) + Math.random().toString(36).slice(2,8);
}
function todayStr(){
  var d = new Date();
  var m = String(d.getMonth()+1).padStart(2,"0");
  var day = String(d.getDate()).padStart(2,"0");
  return d.getFullYear() + "-" + m + "-" + day;
}

/* ---------- version comparison (natural, approximate) ---------- */
function normVer(v){
  return String(v == null ? "" : v).trim().replace(/^[vV](?=\d)/, "");
}
function tokenizeVer(v){
  return normVer(v).match(/\d+|\D+/g) || [];
}
function cmpVer(a, b){
  var ta = tokenizeVer(a), tb = tokenizeVer(b);
  var n = Math.max(ta.length, tb.length);
  for(var i=0;i<n;i++){
    var x = ta[i], y = tb[i];
    if(x === undefined) return -1;
    if(y === undefined) return 1;
    var xd = /^\d+$/.test(x), yd = /^\d+$/.test(y);
    if(xd && yd){
      var xs = x.replace(/^0+/,"") || "0";
      var ys = y.replace(/^0+/,"") || "0";
      if(xs.length !== ys.length) return xs.length < ys.length ? -1 : 1;
      if(xs !== ys) return xs < ys ? -1 : 1;
    }else{
      var xl = x.toLowerCase(), yl = y.toLowerCase();
      if(xl !== yl) return xl < yl ? -1 : 1;
    }
  }
  return 0;
}
function boardStatus(b){
  if(!normVer(b.latestVer)) return "unknown";
  var c = cmpVer(b.curVer || "", b.latestVer);
  return c < 0 ? "update" : "latest";
}

/* ---------- USB drives ---------- 
   Statuses: ready / stale / empty / unknown / none / orphan */
function findUsb(id){
  var list = state.usbs || [];
  for(var i=0;i<list.length;i++){ if(list[i].id === id) return list[i]; }
  return null;
}
function usbStatus(u){
  if(!u.boardId) return "none";
  var b = findBoard(u.boardId);
  if(!b) return "orphan";
  if(!normVer(u.biosVer)) return "empty";
  if(!normVer(b.latestVer)) return "unknown";
  return cmpVer(u.biosVer, b.latestVer) < 0 ? "stale" : "ready";
}
function boardReadyUsb(b){
  var list = state.usbs || [];
  for(var i=0;i<list.length;i++){
    if(list[i].boardId === b.id && usbStatus(list[i]) === "ready") return list[i];
  }
  return null;
}
function usbPendingCount(){
  var n = 0;
  state.boards.forEach(function(b){
    if(boardStatus(b) === "update" && !boardReadyUsb(b)) n++;
  });
  return n;
}

/* ---------- i18n ---------- */
function applyI18n(){
  document.documentElement.lang = state.lang;
  var nodes = document.querySelectorAll("[data-i18n]");
  for(var i=0;i<nodes.length;i++){
    nodes[i].textContent = t(nodes[i].getAttribute("data-i18n"));
  }
  document.getElementById("langSel").value = state.lang;
  renderVendorLinks();
}
function renderVendorLinks(){
  var html = "";
  Object.keys(VENDOR_LINKS).forEach(function(v){
    html += '<a href="' + VENDOR_LINKS[v] + '" target="_blank" rel="noopener noreferrer">' + esc(v) + "</a>";
  });
  document.getElementById("vendorLinks").innerHTML = html;
}

/* ---------- rendering ---------- */
function sortedBoards(){
  var arr = state.boards.slice();
  var rank = { update: 0, unknown: 1, latest: 2 };
  if(sortMode === "update"){
    arr.sort(function(a,b){ return rank[boardStatus(a)] - rank[boardStatus(b)]; });
  }else if(sortMode === "machine"){
    arr.sort(function(a,b){ return String(a.machine).localeCompare(String(b.machine)); });
  }
  return arr;
}
function render(){
  var boards = state.boards;
  var counts = { update:0, latest:0, unknown:0 };
  boards.forEach(function(b){ counts[boardStatus(b)]++; });
  document.getElementById("statTotal").textContent = boards.length;
  document.getElementById("statUpdate").textContent = counts.update;
  document.getElementById("statLatest").textContent = counts.latest;
  document.getElementById("statUnknown").textContent = counts.unknown;
  document.getElementById("statUsbPend").textContent = usbPendingCount();

  var empty = document.getElementById("emptyState");
  var list = document.getElementById("boardList");
  if(boards.length === 0){
    empty.style.display = "block";
    list.innerHTML = "";
  }else{
    empty.style.display = "none";
    list.innerHTML = sortedBoards().map(renderCard).join("");
  }
  renderUsbs();
}
function renderCard(b){
  var st = boardStatus(b);
  var statusLabel = st === "update" ? t("statusUpdate") : (st === "latest" ? t("statusLatest") : t("statusUnknown"));
  var official = b.dlUrl || VENDOR_LINKS[b.vendor] || "";
  var basis = t("basis")
    .replace("{cur}", normVer(b.curVer) || t("unrecorded"))
    .replace("{latest}", normVer(b.latestVer) || t("unrecorded"));
  var h = "";
  h += '<div class="card" data-id="' + esc(b.id) + '">';
  h += '<div class="card-head">';
  h += '<div><div class="machine">' + esc(b.machine) + ' <span class="vendor-chip">' + esc(b.vendor) + "</span></div>";
  h += '<div class="model">' + esc(b.model) + "</div></div>";
  h += '<div class="badge ' + st + '" data-status="' + st + '">' + esc(statusLabel) + "</div>";
  h += "</div>";
  h += '<div class="ver-grid">';
  h += '<div class="ver-box"><div class="k">' + esc(t("curLabel")) + '</div><div class="v">' + esc(normVer(b.curVer) || t("unrecorded")) + "</div>";
  if(b.curDate) h += '<div class="d">' + esc(b.curDate) + "</div>";
  h += "</div>";
  h += '<div class="ver-box"><div class="k">' + esc(t("latestLabel")) + '</div><div class="v">' + esc(normVer(b.latestVer) || t("unrecorded")) + "</div>";
  if(b.latestDate) h += '<div class="d">' + esc(b.latestDate) + "</div>";
  h += "</div></div>";
  h += '<div class="basis">' + esc(basis) + "</div>";
  if(st === "update"){
    var readyUsb = boardReadyUsb(b);
    if(readyUsb){
      h += '<div class="usb-line ok" data-usbline="ready">✓ ' + esc(t("boardUsbReady").replace("{name}", readyUsb.name)) + "</div>";
    }else{
      h += '<div class="usb-line bad" data-usbline="none">⚠ ' + esc(t("boardUsbNone")) + "</div>";
    }
  }
  if(b.memo) h += '<div class="memo">' + esc(b.memo) + "</div>";
  h += '<div class="card-actions">';
  if(official){
    h += '<a class="btn small official-link" href="' + esc(official) + '" target="_blank" rel="noopener noreferrer" style="text-decoration:none; display:inline-block">' + esc(t("actOfficial")) + "</a>";
  }
  if(normVer(b.latestVer)){
    h += '<button class="btn small" data-act="update">' + esc(t("actUpdate")) + "</button>";
  }
  h += '<button class="btn small" data-act="guide">' + esc(t("btnGuide")) + "</button>";
  h += '<button class="btn small" data-act="history">' + esc(t("actHistory")) + " (" + (b.history ? b.history.length : 0) + ")</button>";
  h += '<button class="btn small" data-act="edit">' + esc(t("actEdit")) + "</button>";
  h += '<button class="btn small danger" data-act="del">' + esc(t("actDelete")) + "</button>";
  h += "</div>";
  h += '<div class="history' + (openHistory[b.id] ? " open" : "") + '" data-history>';
  h += "<h4>" + esc(t("histTitle")) + "</h4>";
  if(b.history && b.history.length){
    var items = b.history.slice().reverse();
    items.forEach(function(en){
      h += '<div class="history-item"><div class="h-top">';
      h += '<span class="h-date">' + esc(en.date || "") + "</span>";
      h += '<span class="h-flow">' + esc(en.from || "?") + " → " + esc(en.to || "?") + "</span>";
      if(en.method) h += '<span class="h-method">' + esc(en.method) + "</span>";
      h += "</div>";
      if(en.note) h += '<div class="h-note">' + esc(en.note) + "</div>";
      h += "</div>";
    });
  }else{
    h += '<div class="history-none">' + esc(t("histNone")) + "</div>";
  }
  h += "</div></div>";
  return h;
}
function usbStatusLabel(st){
  var map = { ready: "usbReady", stale: "usbStale", empty: "usbEmpty", unknown: "usbUnknown", none: "usbNone", orphan: "usbOrphan" };
  return t(map[st] || "usbNone");
}
function renderUsbs(){
  var usbs = state.usbs || [];
  var empty = document.getElementById("usbEmpty");
  var list = document.getElementById("usbList");
  if(usbs.length === 0){
    empty.style.display = "block";
    list.innerHTML = "";
    return;
  }
  empty.style.display = "none";
  list.innerHTML = usbs.map(renderUsbCard).join("");
}
function renderUsbCard(u){
  var st = usbStatus(u);
  var b = u.boardId ? findBoard(u.boardId) : null;
  var h = "";
  h += '<div class="card" data-usb-id="' + esc(u.id) + '">';
  h += '<div class="card-head">';
  h += '<div><div class="machine">💾 ' + esc(u.name);
  if(u.capacity) h += ' <span class="chip">' + esc(u.capacity) + "</span>";
  h += u.fat32 === "yes"
    ? ' <span class="chip">' + esc(t("chipFat32")) + "</span>"
    : ' <span class="chip warnchip">' + esc(t("chipNoFat32")) + "</span>";
  h += "</div>";
  h += '<div class="model">' + (b ? esc(b.machine) + " — " + esc(b.model) : esc(t("chipNoBoard"))) + "</div></div>";
  h += '<div class="badge ' + st + '" data-usb-status="' + st + '">' + esc(usbStatusLabel(st)) + "</div>";
  h += "</div>";
  h += '<div class="ver-grid">';
  h += '<div class="ver-box"><div class="k">' + esc(t("uFile")) + '</div><div class="v">' + esc(u.fileName || t("usbNoFile")) + "</div>";
  if(u.prepDate) h += '<div class="d">' + esc(t("uPrepDate")) + ": " + esc(u.prepDate) + "</div>";
  h += "</div>";
  h += '<div class="ver-box"><div class="k">' + esc(t("uUsbVer")) + '</div><div class="v">' + esc(normVer(u.biosVer) || t("unrecorded")) + "</div>";
  h += "</div></div>";
  if(b){
    var basis = t("usbBasis")
      .replace("{board}", b.machine + " / " + b.model)
      .replace("{uver}", normVer(u.biosVer) || t("unrecorded"))
      .replace("{latest}", normVer(b.latestVer) || t("unrecorded"));
    h += '<div class="basis">' + esc(basis) + "</div>";
  }
  if(u.memo) h += '<div class="memo">' + esc(u.memo) + "</div>";
  h += '<div class="card-actions">';
  if(b) h += '<button class="btn small" data-uact="guide">' + esc(t("btnGuide")) + "</button>";
  h += '<button class="btn small" data-uact="edit">' + esc(t("actUsbEdit")) + "</button>";
  h += '<button class="btn small danger" data-uact="del">' + esc(t("actUsbDelete")) + "</button>";
  h += "</div></div>";
  return h;
}

/* ---------- board form ---------- */
function openBoardForm(prefill){
  var f = document.getElementById("boardForm");
  f.reset();
  document.getElementById("fId").value = "";
  document.getElementById("boardModalTitle").textContent = t("formAddTitle");
  if(prefill){
    if(prefill.id){ document.getElementById("fId").value = prefill.id; document.getElementById("boardModalTitle").textContent = t("formEditTitle"); }
    if(prefill.machine != null) document.getElementById("fMachine").value = prefill.machine;
    if(prefill.vendor) document.getElementById("fVendor").value = prefill.vendor;
    if(prefill.model != null) document.getElementById("fModel").value = prefill.model;
    if(prefill.curVer != null) document.getElementById("fCurVer").value = prefill.curVer;
    if(prefill.curDate != null) document.getElementById("fCurDate").value = prefill.curDate;
    if(prefill.latestVer != null) document.getElementById("fLatestVer").value = prefill.latestVer;
    if(prefill.latestDate != null) document.getElementById("fLatestDate").value = prefill.latestDate;
    if(prefill.dlUrl != null) document.getElementById("fDlUrl").value = prefill.dlUrl;
    if(prefill.memo != null) document.getElementById("fMemo").value = prefill.memo;
  }
  document.getElementById("boardModal").classList.add("open");
}
function closeBoardForm(){ document.getElementById("boardModal").classList.remove("open"); }
function findBoard(id){
  for(var i=0;i<state.boards.length;i++){ if(state.boards[i].id === id) return state.boards[i]; }
  return null;
}
function submitBoardForm(ev){
  ev.preventDefault();
  var id = document.getElementById("fId").value;
  var data = {
    machine: document.getElementById("fMachine").value.trim(),
    vendor: document.getElementById("fVendor").value,
    model: document.getElementById("fModel").value.trim(),
    curVer: document.getElementById("fCurVer").value.trim(),
    curDate: document.getElementById("fCurDate").value,
    latestVer: document.getElementById("fLatestVer").value.trim(),
    latestDate: document.getElementById("fLatestDate").value,
    dlUrl: document.getElementById("fDlUrl").value.trim(),
    memo: document.getElementById("fMemo").value.trim()
  };
  if(id && findBoard(id)){
    var b = findBoard(id);
    Object.keys(data).forEach(function(k){ b[k] = data[k]; });
    b.updatedAt = Date.now();
  }else{
    data.id = uid();
    data.history = [];
    data.createdAt = Date.now();
    data.updatedAt = Date.now();
    state.boards.push(data);
  }
  saveState();
  closeBoardForm();
  render();
}

/* ---------- update record flow ---------- */
function buildChecklist(){
  var wrap = document.getElementById("uChecklist");
  var labels = t("checks");
  var h = "";
  labels.forEach(function(label, i){
    h += '<label class="check-item" data-check-wrap><input type="checkbox" class="u-check" id="uCheck' + i + '"><span class="ct">' + esc(label) + "</span></label>";
  });
  wrap.innerHTML = h;
  var boxes = wrap.querySelectorAll(".u-check");
  for(var i=0;i<boxes.length;i++){
    boxes[i].addEventListener("change", refreshUpdateConfirm);
  }
}
function refreshUpdateConfirm(){
  var boxes = document.querySelectorAll(".u-check");
  var all = boxes.length > 0;
  for(var i=0;i<boxes.length;i++){
    if(!boxes[i].checked) all = false;
    boxes[i].closest(".check-item").classList.toggle("checked", boxes[i].checked);
  }
  document.getElementById("btnUpdateConfirm").disabled = !all;
}
function openUpdate(id){
  var b = findBoard(id);
  if(!b || !normVer(b.latestVer)) return;
  updateTargetId = id;
  document.getElementById("uBoardName").textContent = b.machine + " — " + b.model;
  document.getElementById("uFrom").textContent = normVer(b.curVer) || t("unrecorded");
  document.getElementById("uTo").textContent = normVer(b.latestVer);
  document.getElementById("uDate").value = todayStr();
  document.getElementById("uNote").value = "";
  var boxes = document.querySelectorAll(".u-check");
  for(var i=0;i<boxes.length;i++){ boxes[i].checked = false; }
  refreshUpdateConfirm();
  document.getElementById("updateModal").classList.add("open");
}
function closeUpdate(){ document.getElementById("updateModal").classList.remove("open"); updateTargetId = null; }
function confirmUpdate(){
  var b = findBoard(updateTargetId);
  if(!b) return;
  var from = b.curVer || "";
  var to = b.latestVer || "";
  var entry = {
    date: document.getElementById("uDate").value || todayStr(),
    from: from,
    to: to,
    method: document.getElementById("uMethod").value,
    note: document.getElementById("uNote").value.trim()
  };
  if(!Array.isArray(b.history)) b.history = [];
  b.history.push(entry);
  b.curVer = to;
  if(b.latestDate) b.curDate = b.latestDate;
  b.updatedAt = Date.now();
  saveState();
  closeUpdate();
  render();
}
</script>

<script>
"use strict";
/* ---------- collector batch (.bat, ASCII only, CRLF, ends with pause) ---------- */
function collectorBatText(){
  var lines = [
    "@echo off",
    "rem BIOSMAN info collector",
    "rem Reads motherboard and BIOS information and writes biosman-info.txt",
    "rem next to this file. Nothing is sent anywhere.",
    "setlocal",
    "set \"BIOSMAN_OUT=%~dp0biosman-info.txt\"",
    "echo Collecting motherboard and BIOS information...",
    "powershell -NoProfile -ExecutionPolicy Bypass -Command \"$bb=Get-CimInstance Win32_BaseBoard; $b=Get-CimInstance Win32_BIOS; @('BASEBOARD_MANUFACTURER='+$bb.Manufacturer,'BASEBOARD_PRODUCT='+$bb.Product,'BASEBOARD_VERSION='+$bb.Version,'BIOS_MANUFACTURER='+$b.Manufacturer,'BIOS_VERSION='+$b.SMBIOSBIOSVersion,'BIOS_RELEASEDATE='+$b.ReleaseDate.ToString('yyyy-MM-dd')) | Set-Content -Encoding UTF8 $env:BIOSMAN_OUT\"",
    "if exist \"%BIOSMAN_OUT%\" (",
    "  echo Done. Saved to: %BIOSMAN_OUT%",
    "  echo Paste the contents of biosman-info.txt into BIOSMAN (Import collected text).",
    ") else (",
    "  echo Failed to collect information.",
    ")",
    "pause",
    "endlocal",
    ""
  ];
  return lines.join("\r\n");
}
function downloadCollector(){
  var blob = new Blob([collectorBatText()], { type: "text/plain" });
  var url = URL.createObjectURL(blob);
  var a = document.createElement("a");
  a.href = url;
  a.download = "biosman-collect.bat";
  document.body.appendChild(a);
  a.click();
  document.body.removeChild(a);
  setTimeout(function(){ URL.revokeObjectURL(url); }, 2000);
}

/* ---------- parse collected text ---------- */
function detectVendor(manufacturer){
  var s = String(manufacturer || "").toLowerCase();
  if(s.indexOf("asustek") >= 0 || s.indexOf("asus") >= 0) return "ASUS";
  if(s.indexOf("micro-star") >= 0 || s.indexOf("msi") >= 0) return "MSI";
  if(s.indexOf("gigabyte") >= 0) return "GIGABYTE";
  if(s.indexOf("asrock") >= 0) return "ASRock";
  if(s.indexOf("biostar") >= 0) return "Biostar";
  return "Other";
}
function parseCollectedDate(v){
  var s = String(v || "").trim();
  var m = s.match(/^(\d{4})-(\d{2})-(\d{2})/);
  if(m) return m[1] + "-" + m[2] + "-" + m[3];
  m = s.match(/^(\d{4})(\d{2})(\d{2})/);
  if(m) return m[1] + "-" + m[2] + "-" + m[3];
  m = s.match(/^(\d{1,2})\/(\d{1,2})\/(\d{4})/);
  if(m) return m[3] + "-" + m[1].padStart(2,"0") + "-" + m[2].padStart(2,"0");
  return "";
}
function parseCollected(text){
  var kv = {};
  String(text || "").split(/\r?\n/).forEach(function(line){
    var idx = line.indexOf("=");
    if(idx > 0){
      var k = line.slice(0, idx).trim().toUpperCase();
      var v = line.slice(idx + 1).trim().replace(/^\uFEFF/, "");
      if(k) kv[k] = v;
    }
  });
  var get = function(keys){
    for(var i=0;i<keys.length;i++){ if(kv[keys[i]]) return kv[keys[i]]; }
    return "";
  };
  var manufacturer = get(["BASEBOARD_MANUFACTURER","MANUFACTURER","BASEBOARDMANUFACTURER"]);
  var product = get(["BASEBOARD_PRODUCT","PRODUCT","BASEBOARDPRODUCT"]);
  var biosVer = get(["BIOS_VERSION","SMBIOSBIOSVERSION","BIOSVERSION"]);
  var biosDate = get(["BIOS_RELEASEDATE","RELEASEDATE","BIOSDATE"]);
  if(!manufacturer && !product && !biosVer) return null;
  return {
    vendor: detectVendor(manufacturer),
    model: product,
    curVer: biosVer,
    curDate: parseCollectedDate(biosDate)
  };
}
function openImport(){ document.getElementById("importModal").classList.add("open"); }
function closeImport(){ document.getElementById("importModal").classList.remove("open"); }
function doParseImport(){
  var parsed = parseCollected(document.getElementById("importText").value);
  if(!parsed){ alert(t("iParseFail")); return; }
  parsed.machine = document.getElementById("importMachine").value.trim();
  closeImport();
  openBoardForm(parsed);
}

/* ---------- JSON export / import ---------- */
function exportJson(){
  var payload = { app: "BIOSMAN", version: 1, exportedAt: new Date().toISOString(), boards: state.boards, usbs: state.usbs || [] };
  var blob = new Blob([JSON.stringify(payload, null, 2)], { type: "application/json" });
  var url = URL.createObjectURL(blob);
  var a = document.createElement("a");
  a.href = url;
  a.download = "biosman-data.json";
  document.body.appendChild(a);
  a.click();
  document.body.removeChild(a);
  setTimeout(function(){ URL.revokeObjectURL(url); }, 2000);
}
function importJsonFile(file){
  var reader = new FileReader();
  reader.onload = function(){
    try{
      var parsed = JSON.parse(String(reader.result || ""));
      var boards = Array.isArray(parsed) ? parsed : parsed.boards;
      if(!Array.isArray(boards)) throw new Error("bad format");
      boards.forEach(function(b){
        if(!b.id) b.id = uid();
        if(!Array.isArray(b.history)) b.history = [];
      });
      var usbs = Array.isArray(parsed.usbs) ? parsed.usbs : [];
      usbs.forEach(function(u){
        if(!u.id) u.id = "u" + uid().slice(1);
      });
      var msg = t("importConfirm").replace("{cur}", state.boards.length).replace("{n}", boards.length);
      if(state.boards.length > 0 && !window.confirm(msg)) return;
      state.boards = boards;
      state.usbs = usbs;
      saveState();
      render();
      alert(t("importOk").replace("{n}", boards.length));
    }catch(e){
      alert(t("importFail"));
    }
  };
  reader.readAsText(file);
}

<script>
"use strict";
/* ================= PC bridge features (desktop .exe only) =================
   Uses window.biosmanPC when present (Electron shell). In a plain browser
   the bridge is absent: the scan / version-check buttons stay disabled and
   an explanation is shown. Everything here is read-only toward USB drives:
   scanning lists files, it never writes or deletes anything. */
var scanResults = [];     /* [{ file, est, match }] */
var scanDone = false;
var scanError = "";
var verCandidates = [];   /* [{ boardId, ver }] */
var newVerFindings = [];  /* [{ boardId, ver, estimated }] */
var checkRan = false;
var pcNotified = {};      /* dedupe keys for OS notifications, per session */
var pcScanning = false;
var pcChecking = false;

function pcBridge(){
  var p = window.biosmanPC;
  return (p && typeof p.scanUSB === "function" && typeof p.fetchText === "function" && typeof p.notify === "function") ? p : null;
}
function pcNotify(key, title, body){
  if(pcNotified[key]) return;
  pcNotified[key] = 1;
  var pc = pcBridge();
  if(pc){
    try{
      var r = pc.notify(title, body);
      if(r && typeof r.catch === "function") r.catch(function(){});
    }catch(e){ /* notifications are best-effort */ }
  }
}
function fmtSize(n){
  n = Number(n) || 0;
  if(n >= 1024 * 1024) return (Math.round(n / (1024 * 1024) * 10) / 10) + " MB";
  if(n >= 1024) return (Math.round(n / 1024 * 10) / 10) + " KB";
  return n + " B";
}
function fmtMtime(s){
  var v = String(s || "");
  return v ? v.replace("T", " ").slice(0, 16) : "";
}

/* ---------- version estimate from a file name ----------
   Estimates only — always labelled as such in the UI and editable before
   anything is recorded. Returns "" when nothing plausible can be read. */
function estimateVersion(name){
  var raw = String(name || "");
  var dot = raw.lastIndexOf(".");
  var base = dot > 0 ? raw.slice(0, dot) : raw;
  var ext = dot > 0 ? raw.slice(dot + 1) : "";
  var containerExts = ["cap", "rom", "bin", "efi", "fd", "bio", "hdr", "wph", "img"];
  /* MSI / GIGABYTE style: the version is the extension (E7D75AMS.1H0, B650EAORUS.F12) */
  if(ext && containerExts.indexOf(ext.toLowerCase()) < 0 && /^[A-Za-z]?\d[A-Za-z0-9]{0,3}$/.test(ext)){
    return ext.toUpperCase();
  }
  /* ASUS style: ...-2904.CAP — a trailing 3–5 digit run in the base name */
  var m = base.match(/[-_](\d{3,5})$/);
  if(m) return m[1];
  return "";
}

/* ---------- matching a scanned file against the registry ---------- */
function flashVendorFor(name){
  var lower = String(name || "").toLowerCase();
  var rf = t("ruleFile") || {};
  var keys = Object.keys(rf);
  for(var i = 0; i < keys.length; i++){
    if(String(rf[keys[i]]).toLowerCase() === lower) return keys[i];
  }
  return "";
}
function matchScanFile(f){
  var lower = String(f.name || "").toLowerCase();
  var rec = null;
  (state.usbs || []).forEach(function(u){
    if(!rec && u.fileName && u.fileName.toLowerCase() === lower) rec = u;
  });
  if(rec){
    return { type: "recorded", usb: rec, board: rec.boardId ? findBoard(rec.boardId) : null, candidates: [], flashVendor: flashVendorFor(f.name) };
  }
  var fv = flashVendorFor(f.name);
  var cand = [];
  var seen = {};
  function pushCand(b){ if(b && !seen[b.id]){ seen[b.id] = 1; cand.push(b); } }
  if(fv){
    state.boards.forEach(function(b){ if(b.vendor === fv) pushCand(b); });
  }
  var base = lower.replace(/\.[^.]*$/, "");
  state.boards.forEach(function(b){
    var tokens = String(b.model || "").toLowerCase().split(/[^a-z0-9]+/);
    for(var i = 0; i < tokens.length; i++){
      if(tokens[i].length >= 4 && base.indexOf(tokens[i]) >= 0){ pushCand(b); break; }
    }
  });
  if(cand.length) return { type: "candidates", usb: null, board: null, candidates: cand, flashVendor: fv };
  return { type: "unknown", usb: null, board: null, candidates: [], flashVendor: fv };
}

/* ---------- scan result rendering ---------- */
function matchCellHtml(r){
  var m = r.match;
  if(m.type === "recorded"){
    var h = '<span class="chip">' + esc(t("matchRecorded")) + "</span>";
    if(m.board) h += '<div class="scan-sub">' + esc(m.board.machine + " — " + m.board.model) + "</div>";
    else if(m.usb) h += '<div class="scan-sub">' + esc(m.usb.name) + "</div>";
    if(m.usb) h += '<div><span class="badge ' + usbStatus(m.usb) + ' scan-badge">' + esc(usbStatusLabel(usbStatus(m.usb))) + "</span></div>";
    return h;
  }
  if(m.type === "candidates"){
    var names = m.candidates.map(function(b){ return b.machine + " — " + b.model; }).join(" / ");
    var hh = '<span class="chip warnchip">' + esc(t("matchCandidate")) + "</span>";
    hh += '<div class="scan-sub">' + esc(names) + "</div>";
    if(m.flashVendor) hh += '<div class="scan-sub">' + esc(t("matchFlash").replace("{vendor}", m.flashVendor)) + "</div>";
    return hh;
  }
  var uh = '<span class="chip graychip">' + esc(t("matchUnknown")) + "</span>";
  if(m.flashVendor) uh += '<div class="scan-sub">' + esc(t("matchFlash").replace("{vendor}", m.flashVendor)) + "</div>";
  return uh;
}
function renderScanResults(){
  var wrap = document.getElementById("scanList");
  var meta = document.getElementById("scanMeta");
  if(!scanDone){ wrap.innerHTML = ""; meta.textContent = ""; renderNewVerBanner(); return; }
  meta.textContent = scanError
    ? t("scanError").replace("{error}", scanError)
    : t("scanFound").replace("{n}", scanResults.length);
  if(!scanResults.length){
    wrap.innerHTML = '<div class="history-none">' + esc(t("scanNone")) + "</div>";
    return;
  }
  var typed = {};
  wrap.querySelectorAll("input[data-ver-for]").forEach(function(inp){
    typed[inp.getAttribute("data-ver-for")] = inp.value;
  });
  var h = '<div class="scan-scroll"><table class="scan"><thead><tr>' +
    "<th>" + esc(t("scanColDrive")) + "</th><th>" + esc(t("scanColFile")) + "</th><th>" + esc(t("scanColSize")) + "</th><th>" + esc(t("scanColMtime")) + "</th><th>" + esc(t("scanColMatch")) + "</th><th>" + esc(t("scanColVer")) + "</th><th></th>" +
    "</tr></thead><tbody>";
  scanResults.forEach(function(r, idx){
    var f = r.file;
    var key = f.path || ((f.drive || "") + "|" + (f.name || ""));
    var verVal = (key in typed) ? typed[key]
      : (r.match.type === "recorded" && r.match.usb ? (r.match.usb.biosVer || "") : r.est);
    h += '<tr data-scan-idx="' + idx + '">';
    h += "<td>" + esc(f.drive || "") + "</td>";
    h += '<td><div class="scan-name">' + esc(f.name) + '</div><div class="scan-path">' + esc(f.path || "") + "</div></td>";
    h += "<td>" + esc(fmtSize(f.size)) + "</td>";
    h += "<td>" + esc(fmtMtime(f.mtime)) + "</td>";
    h += "<td>" + matchCellHtml(r) + "</td>";
    h += '<td><input class="ver-input" data-ver-for="' + esc(key) + '" value="' + esc(verVal) + '" maxlength="40">';
    if(r.est) h += '<div class="scan-est">' + esc(t("estLabel")) + ": " + esc(r.est) + "</div>";
    h += "</td>";
    h += '<td><button class="btn small" data-sact="record">' + esc(t("btnRecordFile")) + "</button></td>";
    h += "</tr>";
  });
  h += "</tbody></table></div>";
  wrap.innerHTML = h;
}
function renderNewVerBanner(){
  var el = document.getElementById("newVerBanner");
  if(!newVerFindings.length){ el.style.display = "none"; el.innerHTML = ""; return; }
  var h = '<div class="nvb-title">🔔 ' + esc(t("newerBannerTitle")) + "</div>";
  newVerFindings.forEach(function(f){
    var b = findBoard(f.boardId);
    if(!b) return;
    var line = t("newerLine")
      .replace("{machine}", b.machine)
      .replace("{model}", b.model)
      .replace("{cur}", normVer(b.curVer) || t("unrecorded"))
      .replace("{ver}", normVer(f.ver));
    h += '<div class="nvb-line">' + esc(line);
    if(f.estimated) h += ' <span class="scan-est">(' + esc(t("estLabel")) + ")</span>";
    h += "</div>";
  });
  el.innerHTML = h;
  el.style.display = "block";
}

/* ---------- newer-version check over the scan results ---------- */
function rowVersion(r, idx){
  var inp = document.querySelector('tr[data-scan-idx="' + idx + '"] input[data-ver-for]');
  if(inp) return inp.value.trim();
  if(r.match.type === "recorded" && r.match.usb) return r.match.usb.biosVer || "";
  return r.est || "";
}
function checkUsbNewer(allowNotify){
  newVerFindings = [];
  var seenBoard = {};
  scanResults.forEach(function(r, idx){
    var b = null;
    if(r.match.type === "recorded") b = r.match.board;
    else if(r.match.type === "candidates" && r.match.candidates.length === 1) b = r.match.candidates[0];
    if(!b || seenBoard[b.id]) return;
    var ver = rowVersion(r, idx);
    if(!normVer(ver) || !normVer(b.curVer)) return;
    if(cmpVer(ver, b.curVer) > 0){
      seenBoard[b.id] = 1;
      var isRecordedVer = r.match.type === "recorded" && r.match.usb && normVer(r.match.usb.biosVer) === normVer(ver);
      newVerFindings.push({ boardId: b.id, ver: normVer(ver), estimated: !isRecordedVer });
      /* OS notifications are only sent for confirmed values (a version the
         user already recorded in the USB registry), and only as a result of
         an explicit scan — bookkeeping edits refresh the banner silently.
         Estimates from file names appear in the in-page banner, labelled. */
      if(isRecordedVer && allowNotify){
        pcNotify("usb|" + b.id + "|" + normVer(ver), t("notifyTitle"),
          t("newerLine")
            .replace("{machine}", b.machine)
            .replace("{model}", b.model)
            .replace("{cur}", normVer(b.curVer))
            .replace("{ver}", normVer(ver)));
      }
    }
  });
}
function refreshScanMatches(){
  if(!scanDone) return;
  scanResults.forEach(function(r){ r.match = matchScanFile(r.file); });
  renderScanResults();
  checkUsbNewer(false);
  renderNewVerBanner();
}

/* ---------- "Scan USB drives" ---------- */
function doScanUsb(){
  var pc = pcBridge();
  if(!pc || pcScanning) return;
  pcScanning = true;
  var btn = document.getElementById("btnScanUsb");
  btn.disabled = true;
  btn.textContent = t("scanBusy");
  pc.scanUSB().then(function(res){
    scanError = res && res.error ? String(res.error) : "";
    var files = res && Array.isArray(res.files) ? res.files : [];
    scanResults = files.map(function(f){
      return { file: f, est: estimateVersion(f.name), match: matchScanFile(f) };
    });
    scanDone = true;
  }).catch(function(e){
    scanError = String((e && e.message) || e);
    scanResults = [];
    scanDone = true;
  }).then(function(){
    pcScanning = false;
    btn.disabled = false;
    btn.textContent = t("btnScanUsb");
    renderScanResults();
    checkUsbNewer(true);
    renderNewVerBanner();
  });
}

/* ---------- version candidates from an official page ----------
   Heuristic extraction only. Page layouts differ per vendor, so a human
   always confirms a candidate before it is recorded as the latest. */
function extractVersionCandidates(html){
  var text = String(html || "")
    .replace(/<script[\s\S]*?<\/script>/gi, " ")
    .replace(/<style[\s\S]*?<\/style>/gi, " ")
    .replace(/<[^>]+>/g, " ")
    .replace(/&nbsp;/gi, " ")
    .replace(/\s+/g, " ");
  var found = {};
  var order = [];
  function add(v){
    v = normVer(String(v || "").trim().replace(/[.,;:]$/, ""));
    if(!v || v.length > 16 || !/\d/.test(v)) return;
    var k = v.toLowerCase();
    if(!(k in found)){ found[k] = v; order.push(v); }
  }
  var m;
  var reLabel = /(?:BIOS\s*)?(?:Version|Ver\.?)\s*[:#]?\s*([0-9][0-9A-Za-z.\-]{0,14}|[A-Za-z][0-9][0-9A-Za-z.\-]{0,10})/gi;
  while((m = reLabel.exec(text)) !== null) add(m[1]);
  var reExt = /[A-Za-z0-9_\-]{3,}\.((?:F|f)\d{1,2}[a-z]?|\d[A-Za-z0-9]{1,3})\b/g;
  while((m = reExt.exec(text)) !== null) add(m[1]);
  var reCap = /[A-Za-z0-9_\-]*?[-_](\d{3,5})\.(?:CAP|cap)\b/g;
  while((m = reCap.exec(text)) !== null) add(m[1]);
  return order;
}
function renderCheckMeta(errors, note){
  var el = document.getElementById("checkMeta");
  var h = "";
  (errors || []).forEach(function(e){ h += '<div class="warn-text">' + esc(e) + "</div>"; });
  if(note) h += '<div class="basis">' + esc(note) + "</div>";
  el.innerHTML = h;
}
function renderCandidates(){
  var wrap = document.getElementById("candidateList");
  if(!verCandidates.length){
    wrap.innerHTML = checkRan ? '<div class="history-none" style="margin-top:8px">' + esc(t("candNone")) + "</div>" : "";
    return;
  }
  var byBoard = {};
  var order = [];
  verCandidates.forEach(function(c){
    if(!byBoard[c.boardId]){ byBoard[c.boardId] = []; order.push(c.boardId); }
    byBoard[c.boardId].push(c.ver);
  });
  var h = '<div class="cand-head">' + esc(t("candTitle")) + "</div>";
  h += '<div class="guide-note" style="margin:0 0 10px">' + esc(t("candNote")) + "</div>";
  order.forEach(function(bid){
    var b = findBoard(bid);
    if(!b) return;
    h += '<div class="scan-sub" style="margin:10px 0 6px; font-weight:700; color:var(--text); font-size:13.5px">' +
      esc(t("candFor").replace("{machine}", b.machine).replace("{model}", b.model)) + "</div>";
    byBoard[bid].forEach(function(v){
      var basis = t("basis")
        .replace("{cur}", normVer(b.curVer) || t("unrecorded"))
        .replace("{latest}", normVer(b.latestVer) || t("unrecorded"));
      h += '<div class="cand-row"><span class="cand-ver">' + esc(v) + '</span>' +
        '<span class="scan-sub" style="margin-top:0">' + esc(basis) + "</span>" +
        '<span style="flex:1"></span>' +
        '<button class="btn small primary" data-cact="record" data-board="' + esc(bid) + '" data-ver="' + esc(v) + '">' + esc(t("btnRecordLatest")) + "</button></div>";
    });
  });
  wrap.innerHTML = h;
}

/* ---------- "Check for newer versions" ---------- */
function doCheckVersions(){
  var pc = pcBridge();
  if(!pc || pcChecking) return;
  var targets = state.boards.filter(function(b){ return !!b.dlUrl; });
  if(!targets.length){
    checkRan = true;
    renderCheckMeta([], t("checkNoUrl"));
    renderCandidates();
    return;
  }
  pcChecking = true;
  checkRan = true;
  var btn = document.getElementById("btnCheckVer");
  btn.disabled = true;
  btn.textContent = t("checkBusyLabel");
  var errors = [];
  var chain = Promise.resolve();
  targets.forEach(function(b){
    chain = chain.then(function(){
      return pc.fetchText(b.dlUrl).then(function(res){
        if(!res || !res.ok){
          errors.push(t("checkFail")
            .replace("{board}", b.machine + " — " + b.model)
            .replace("{error}", (res && (res.error || ("HTTP " + res.status))) || "unknown"));
          return;
        }
        var base = normVer(b.latestVer) || normVer(b.curVer);
        var cands = extractVersionCandidates(res.text);
        if(!base){
          cands.sort(function(x, y){ return cmpVer(y, x); });
          cands = cands.slice(0, 6);
        }
        cands.forEach(function(v){
          if(base && cmpVer(v, base) <= 0) return;
          var exists = verCandidates.some(function(c){ return c.boardId === b.id && c.ver === v; });
          if(exists) return;
          verCandidates.push({ boardId: b.id, ver: v });
          pcNotify("web|" + b.id + "|" + normVer(v), t("notifyTitle"),
            t("candNotify")
              .replace("{machine}", b.machine)
              .replace("{model}", b.model)
              .replace("{ver}", v));
        });
      }).catch(function(e){
        errors.push(t("checkFail")
          .replace("{board}", b.machine + " — " + b.model)
          .replace("{error}", String((e && e.message) || e)));
      });
    });
  });
  chain.then(function(){
    pcChecking = false;
    btn.disabled = false;
    btn.textContent = t("btnCheckVer");
    renderCheckMeta(errors);
    renderCandidates();
  });
}

/* ---------- pc panel events ---------- */
document.getElementById("btnScanUsb").addEventListener("click", doScanUsb);
document.getElementById("btnCheckVer").addEventListener("click", doCheckVersions);
document.getElementById("scanList").addEventListener("click", function(ev){
  var btn = ev.target.closest("[data-sact]");
  if(!btn) return;
  var tr = btn.closest("tr[data-scan-idx]");
  if(!tr) return;
  var r = scanResults[Number(tr.getAttribute("data-scan-idx"))];
  if(!r) return;
  var inp = tr.querySelector("input[data-ver-for]");
  var ver = inp ? inp.value.trim() : "";
  var prefill = {
    boardId: "",
    fileName: r.file.name,
    biosVer: ver,
    prepDate: /^\d{4}-\d{2}-\d{2}$/.test(String(r.file.mtime || "").slice(0, 10)) ? String(r.file.mtime).slice(0, 10) : todayStr()
  };
  if(r.match.type === "recorded" && r.match.usb){
    var u = r.match.usb;
    prefill.id = u.id;
    prefill.name = u.name;
    prefill.capacity = u.capacity;
    prefill.fat32 = u.fat32;
    prefill.memo = u.memo;
    prefill.boardId = u.boardId || "";
  }else{
    prefill.name = t("scanUsbName").replace("{drive}", r.file.drive || "USB");
    prefill.memo = r.file.path || "";
    if(r.match.type === "candidates" && r.match.candidates.length === 1) prefill.boardId = r.match.candidates[0].id;
  }
  openUsbForm(prefill);
});
document.getElementById("candidateList").addEventListener("click", function(ev){
  var btn = ev.target.closest("[data-cact]");
  if(!btn) return;
  var bid = btn.getAttribute("data-board");
  var ver = btn.getAttribute("data-ver");
  var b = findBoard(bid);
  if(!b || !ver) return;
  b.latestVer = ver;
  b.updatedAt = Date.now();
  saveState();
  render();
  verCandidates = verCandidates.filter(function(c){ return !(c.boardId === bid && c.ver === ver); });
  renderCheckMeta([], t("recordedLatest").replace("{machine}", b.machine).replace("{ver}", ver));
  renderCandidates();
});
document.getElementById("usbForm").addEventListener("submit", function(){
  /* Registered after the built-in submit handler, so the record is already
     saved when this runs: refresh the scan matches against the new data. */
  refreshScanMatches();
});
document.getElementById("langSel").addEventListener("change", function(){
  initPcPanel();
  renderScanResults();
  renderNewVerBanner();
  renderCandidates();
});

/* ---------- pc panel init ---------- */
function initPcPanel(){
  var avail = !!pcBridge();
  document.getElementById("pcUnavailable").style.display = avail ? "none" : "block";
  document.getElementById("pcState").textContent = avail ? t("pcOn") : t("pcOff");
  document.getElementById("btnScanUsb").disabled = !avail;
  document.getElementById("btnCheckVer").disabled = !avail;
}
initPcPanel();
</script>
